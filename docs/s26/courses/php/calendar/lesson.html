    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Class Schedule</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>My Class Schedule</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>8:00 - 9:00</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>Math</td>
            <td>English</td>
            <td>Break</td>
            <td>Computer</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Physics</td>
            <td>Math</td>
            <td>English</td>
            <td>Free</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>Computer</td>
            <td>Physics</td>
            <td>Break</td>
            <td>Math</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>English</td>
            <td>Computer</td>
            <td>Physics</td>
            <td>Free</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>Math</td>
            <td>English</td>
            <td>Computer</td>
            <td>Break</td>
        </tr>
    </table>

</body>
</html>
