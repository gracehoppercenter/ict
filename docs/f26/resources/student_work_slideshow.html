<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Work Showcase</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  body.idle { cursor: none; }
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide.on { opacity: 1; }
  .slide video,
  .slide img.fit {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  /* Tall website screenshots fill the width and slowly scroll down */
  .slide img.page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    transform: translateY(0);
  }
  .caption {
    position: absolute;
    left: 2vw;
    bottom: 2vw;
    padding: 0.4em 0.9em;
    border-radius: 0.4em;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    font-size: clamp(14px, 1.6vw, 28px);
    line-height: 1.3;
    pointer-events: none;
  }
  .caption small {
    display: block;
    opacity: 0.75;
    font-size: 0.7em;
  }
  .caption:empty { display: none; }

  /* ---------- Controls (sized for a big touch screen) ---------- */
  .controls {
    position: absolute;
    left: 50%;
    bottom: 2vw;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    border-radius: 999px;
    background: rgba(20, 20, 24, 0.82);
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 10;
  }
  body.idle .controls {
    opacity: 0;
    transform: translateX(-50%) translateY(20px);
    pointer-events: none;
  }
  .controls button {
    width: 72px;
    height: 72px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  .controls button:hover { background: rgba(255, 255, 255, 0.12); }
  .controls button:active { background: rgba(255, 255, 255, 0.25); }
  .controls svg { width: 36px; height: 36px; fill: currentColor; }
  .controls .count {
    min-width: 5.5em;
    text-align: center;
    color: rgba(255, 255, 255, 0.8);
    font-size: 18px;
    font-variant-numeric: tabular-nums;
  }
  .controls .sep {
    width: 1px;
    height: 40px;
    background: rgba(255, 255, 255, 0.2);
    margin: 0 4px;
  }
  /* Thin progress bar along the bottom edge while playing */
  .progress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 4px;
    width: 0;
    background: rgba(255, 255, 255, 0.55);
    z-index: 5;
    pointer-events: none;
  }
  .paused-badge {
    position: absolute;
    top: 2vw;
    right: 2vw;
    padding: 0.35em 0.8em;
    border-radius: 0.4em;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    font-size: clamp(14px, 1.2vw, 22px);
    display: none;
    pointer-events: none;
  }
  body.paused .paused-badge { display: block; }

  /* ---------- Gallery ---------- */
  .gallery {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: #0b0b10;
    color: #fff;
    display: none;
    flex-direction: column;
  }
  .gallery.open { display: flex; }
  .gallery header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 28px;
    flex-wrap: wrap;
  }
  .gallery h2 {
    margin: 0 16px 0 0;
    font-size: 28px;
    font-weight: 600;
  }
  .gallery .chip {
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: transparent;
    color: #fff;
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 18px;
    cursor: pointer;
  }
  .gallery .chip.on { background: #fff; color: #000; border-color: #fff; }
  .gallery .close {
    margin-left: auto;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 0;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 34px;
    line-height: 1;
    cursor: pointer;
  }
  .gallery .grid {
    flex: 1;
    overflow-y: auto;
    padding: 4px 28px 28px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    grid-auto-rows: max-content;
    align-content: start;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
  }
  .card {
    display: flex;
    flex-direction: column;
    width: 100%;
    background: #1a1a20;
    border: 3px solid transparent;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    padding: 0;
    color: inherit;
    font: inherit;
    text-align: left;
  }
  .card.current { border-color: #ffd34d; }
  .card .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #000;
    overflow: hidden;
  }
  .card .thumb img,
  .card .thumb video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card .thumb img.page { object-position: top; }
  .card .kind {
    position: absolute;
    top: 8px;
    left: 8px;
    padding: 3px 9px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.7);
    font-size: 13px;
  }
  .card .label { padding: 10px 12px 12px; }
  .card .label b { display: block; font-size: 17px; font-weight: 600; }
  .card .label span { display: block; font-size: 14px; opacity: 0.65; margin-top: 2px; }
</style>
</head>
<body>
<script>
  // Media lives in ./slideshow/. Game clips were captured from the ITD 210
  // game projects (s26/courses/itd210/projects/game/) and student sites;
  // website images are full-page screenshots of student sites.
  //
  // type 'video': plays once, then advances
  // type 'page':  full-width screenshot that scrolls top to bottom
  // type 'image': shown whole (letterboxed) for `secs` seconds
  // `site` and `label` are only shown in the gallery, to tell slides apart.
  const M = 'slideshow/';
  const slides = [
    { type: 'video', src: M + 'zombie.mp4',  title: 'ITD 210 game project', sub: 'zombie wave survival' },
    { type: 'page',  src: M + 'jjjones64610_coder.jpg', title: 'Student portfolio', site: 'jjjones64610-coder' },
    { type: 'video', src: M + 'fish.mp4',    title: 'Fishhhhhh!', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'udvalm.jpg', title: 'Student portfolio', site: 'udvalm' },
    { type: 'video', src: M + 'flight.mp4', title: 'Block Flight Simulator', sub: 'JavaScript 3D flight sim' },
    { type: 'page',  src: M + 'a_virginian.jpg', title: 'Student portfolio', site: 'a-virginian' },
    { type: 'video', src: M + 'kitty.mp4',   title: 'Sir Kittywhiskerkins the Wizard Cat', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'ghaynes429.jpg', title: 'Student portfolio', site: 'ghaynes429' },
    { type: 'image', src: 'https://1bmedina.github.io/itd256/Projects/weaviate/media/diagram.png', title: 'ITD 256 project' },
    { type: 'video', src: M + 'titan.mp4',   title: "Titan's Reach", sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'goldenmaca.jpg', title: 'Student portfolio', site: 'goldenmaca' },
    { type: 'video', src: M + 'the_orb.mp4', title: 'The Hunt for THE ORB', sub: 'JavaScript text adventure' },
    { type: 'video', src: M + 'chicken.mp4', title: 'Blocky Chicken Run & Jump', sub: 'JavaScript game' },
    { type: 'page',  src: M + 'catey_wrong.jpg', title: 'Student portfolio', site: 'catey-wrong' },
    { type: 'image', src: 'https://chrismjon.es/images/arl_2050_clusters.png', label: 'Arlington 2050 clusters' },
    { type: 'video', src: M + 'island.mp4',  title: 'Island Battle', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'koibots8230.jpg', title: 'KoiBots robotics team website', site: 'koibots8230' },
    { type: 'image', src: '../images/culinary.png', label: 'Culinary' },
    { type: 'video', src: M + 'bee.mp4',     title: "Busy as a Honey Bee's Knees", sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'molly_frog.jpg', title: 'Student portfolio', site: 'molly-frog' },
    { type: 'video', src: M + 'bach.mp4',    title: 'Bach to Basics', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'toemio.jpg', title: 'Student portfolio', site: 'toemio' },
    { type: 'image', src: '../images/pycon.jpeg', label: 'PyCon' },
    { type: 'video', src: M + 'orange.mp4',  title: 'Orange Slinger', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'greetingsplayer1.jpg', title: 'Student portfolio', site: 'greetingsplayer1' },
    { type: 'page',  src: M + 'apscs.jpg', title: 'APS CS courses site', site: 'apscs.org' },
    { type: 'video', src: M + 'skyfall.mp4', title: 'Skyfall', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'jacehaberlach.jpg', title: 'Student portfolio', site: 'jacehaberlach' },
    { type: 'image', src: '../images/curses_game.png', title: 'Python curses game' },
    { type: 'page',  src: M + 'anguswwilliams.jpg', title: 'Student portfolio', site: 'anguswwilliams' },
    { type: 'page',  src: M + 'f1showo.jpg', title: 'Student portfolio', site: 'f1showo' },
    { type: 'page',  src: M + 'openbookproject.jpg', title: 'Demystifying Computers', site: 'openbookproject.net' },
    { type: 'page',  src: M + 'frostbitewofpotato.jpg', title: 'Student portfolio', site: 'frostbitewofpotato' },
  ];

  const PAGE_SECS = 9;     // time on each website screenshot
  const IMAGE_SECS = 7;    // time on each plain image
  const SCROLL_PX_PER_SEC = 160; // cap on scroll speed for very tall pages
  const IDLE_MS = 4000;    // hide controls after this long without input

  const KIND = { video: 'Game', page: 'Website', image: 'Image' };

  // ---------- Slide layers ----------
  // Two layers that alternate so each slide can crossfade over the last.
  const layers = [0, 1].map(() => {
    const el = document.createElement('div');
    el.className = 'slide';
    document.body.appendChild(el);
    return el;
  });
  const caption = document.createElement('div');
  caption.className = 'caption';
  document.body.appendChild(caption);
  const progress = document.createElement('div');
  progress.className = 'progress';
  document.body.appendChild(progress);
  const badge = document.createElement('div');
  badge.className = 'paused-badge';
  badge.textContent = '❚❚ Paused';
  document.body.appendChild(badge);

  // ---------- Controls ----------
  const ICON = {
    prev: '<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',
    grid: '<svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg>',
    full: '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>',
  };
  const controls = document.createElement('div');
  controls.className = 'controls';
  controls.innerHTML = `
    <button data-act="prev" aria-label="Previous">${ICON.prev}</button>
    <button data-act="toggle" aria-label="Play/pause">${ICON.pause}</button>
    <button data-act="next" aria-label="Next">${ICON.next}</button>
    <span class="count"></span>
    <span class="sep"></span>
    <button data-act="gallery" aria-label="Gallery">${ICON.grid}</button>
    <button data-act="full" aria-label="Fullscreen">${ICON.full}</button>`;
  document.body.appendChild(controls);
  const toggleBtn = controls.querySelector('[data-act=toggle]');
  const countEl = controls.querySelector('.count');

  // ---------- Playback state ----------
  let index = -1, front = 0, playing = true;
  // The advance timer is pausable: we remember how long was left.
  let timer = null, timerEnd = 0, timerLeft = 0;
  let current = null; // { video } or { img, overflow } for the shown slide

  function setTimer(secs) {
    clearTimeout(timer);
    timerLeft = secs * 1000;
    if (playing) runTimer();
    else progress.style.transition = 'none';
  }
  function runTimer() {
    clearTimeout(timer);
    timerEnd = Date.now() + timerLeft;
    timer = setTimeout(() => show(index + 1), timerLeft);
  }
  function stopTimer() {
    clearTimeout(timer);
    timerLeft = Math.max(0, timerEnd - Date.now());
  }

  // Progress bar: driven by video time or the timer.
  function tickProgress() {
    let frac = 0;
    if (current && current.video && current.video.duration) {
      frac = current.video.currentTime / current.video.duration;
    } else if (current && current.total) {
      const left = playing ? Math.max(0, timerEnd - Date.now()) : timerLeft;
      frac = 1 - left / current.total;
    }
    progress.style.width = (frac * 100) + '%';
    requestAnimationFrame(tickProgress);
  }
  requestAnimationFrame(tickProgress);

  // Small still images for the gallery (and video posters), made from the
  // local media: slideshow/thumbs/<name>.jpg. Remote images use themselves.
  function thumbOf(slide) {
    if (!slide.src.startsWith(M)) return null;
    return M + 'thumbs/' + slide.src.slice(M.length).replace(/\.\w+$/, '.jpg');
  }

  // Every clip exists as .mp4 (H.264) and .webm (VP9). Some browsers --
  // including some touch-panel browsers -- can't play H.264, so pick
  // whichever this browser supports.
  const CAN_MP4 = !!document.createElement('video').canPlayType('video/mp4; codecs="avc1.640028"');
  function videoSrc(slide) {
    return CAN_MP4 ? slide.src : slide.src.replace(/\.mp4$/, '.webm');
  }

  function preload(slide) {
    if (slide.type === 'video') {
      const v = document.createElement('video');
      v.preload = 'auto';
      v.src = videoSrc(slide);
    } else {
      new Image().src = slide.src;
    }
  }

  function setCaption(slide) {
    caption.innerHTML = '';
    if (!slide.title) return;
    caption.textContent = slide.title;
    if (slide.sub) {
      const s = document.createElement('small');
      s.textContent = slide.sub;
      caption.appendChild(s);
    }
  }

  // Each call to show() gets a token so late events from an old slide
  // (a video ending, an image loading) can't advance the new one.
  let token = 0;

  function show(i) {
    clearTimeout(timer);
    const my = ++token;
    index = (i + slides.length) % slides.length;
    const slide = slides[index];
    const layer = layers[1 - front];
    layer.innerHTML = '';
    countEl.textContent = `${index + 1} / ${slides.length}`;
    markGalleryCurrent();

    const reveal = () => {
      layers[front].classList.remove('on');
      layer.classList.add('on');
      front = 1 - front;
      setCaption(slide);
      // Stop any video still playing on the outgoing layer after the fade.
      const old = layers[1 - front];
      setTimeout(() => { if (!old.classList.contains('on')) old.innerHTML = ''; }, 900);
      preload(slides[(index + 1) % slides.length]);
    };
    const skip = () => { if (my === token) show(index + 1); };

    if (slide.type === 'video') {
      const v = document.createElement('video');
      v.muted = true;
      v.playsInline = true;
      v.src = videoSrc(slide);
      v.loop = !playing; // while paused, keep the clip running on this slide
      current = { video: v };
      v.onended = () => { if (my === token && playing) show(index + 1); };
      // If the clip can't play at all, show its still image instead of
      // skipping, so jumping to it from the gallery still lands here.
      v.onerror = () => {
        if (my !== token) return;
        const poster = thumbOf(slide);
        if (!poster) return skip();
        const img = document.createElement('img');
        img.className = 'fit';
        img.src = poster;
        img.style.width = '100%';
        layer.innerHTML = '';
        layer.appendChild(img);
        current = { total: IMAGE_SECS * 1000 };
        doReveal();
        setTimer(IMAGE_SECS);
      };
      v.preload = 'auto';
      const poster = thumbOf(slide);
      if (poster) v.poster = poster;
      // Some browsers (Android-based touch panels especially) won't load any
      // video data until play() is called, so start playing right away and
      // reveal on the first frame -- or after a moment, showing the poster.
      let revealed = false;
      const doReveal = () => {
        if (revealed || my !== token) return;
        revealed = true;
        reveal();
      };
      v.addEventListener('loadeddata', doReveal);
      v.addEventListener('playing', doReveal);
      setTimeout(doReveal, 1200);
      v.addEventListener('loadedmetadata', () => {
        if (my === token && isFinite(v.duration)) setTimer(v.duration + 5); // safety net
      });
      layer.appendChild(v);
      const pr = v.play();
      if (pr && pr.catch) pr.catch(() => {});
      setTimer(30);
    } else {
      const img = document.createElement('img');
      img.onerror = skip;
      img.onload = () => {
        if (my !== token) return;
        const shown = img.naturalHeight * (window.innerWidth / img.naturalWidth);
        const overflow = shown - window.innerHeight;
        if (slide.type === 'page' && overflow > 20) {
          img.className = 'page';
          const secs = Math.max(PAGE_SECS, overflow / SCROLL_PX_PER_SEC + 3);
          current = { img, overflow, total: secs * 1000 };
          reveal();
          // hold at the top for a moment, scroll, then hold at the bottom
          img.style.transition = `transform ${secs - 3}s ease-in-out 1.5s`;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            img.style.transform = `translateY(${-overflow}px)`;
          }));
          setTimer(secs);
        } else {
          img.className = 'fit';
          const secs = slide.type === 'page' ? PAGE_SECS : (slide.secs || IMAGE_SECS);
          current = { total: secs * 1000 };
          reveal();
          setTimer(secs);
        }
      };
      img.src = slide.src;
      layer.appendChild(img);
    }
  }

  // Freeze a scrolling page where it is, or carry on to the bottom.
  function freezeScroll() {
    const { img } = current;
    const y = new DOMMatrix(getComputedStyle(img).transform).m42;
    img.style.transition = 'none';
    img.style.transform = `translateY(${y}px)`;
  }
  function resumeScroll() {
    const { img, overflow } = current;
    const y = new DOMMatrix(getComputedStyle(img).transform).m42;
    const remaining = Math.abs(-overflow - y);
    if (remaining < 1) return;
    const secs = Math.max(0.6, remaining / SCROLL_PX_PER_SEC);
    // Make sure the page reaches the bottom before the slide ends.
    if (playing && timerLeft < secs * 1000 + 1500) timerLeft = secs * 1000 + 1500;
    img.style.transition = `transform ${secs}s ease-in-out`;
    requestAnimationFrame(() => { img.style.transform = `translateY(${-overflow}px)`; });
  }

  function setPlaying(p) {
    playing = p;
    toggleBtn.innerHTML = p ? ICON.pause : ICON.play;
    document.body.classList.toggle('paused', !p);
    if (!current) return;
    if (p) {
      if (current.video) { current.video.loop = false; current.video.play(); }
      if (current.img) resumeScroll();
      // A video that already finished while paused moves straight on.
      if (current.video && current.video.ended) { show(index + 1); return; }
      runTimer();
    } else {
      stopTimer();
      if (current.video) current.video.pause();
      if (current.img) freezeScroll();
    }
  }

  function go(delta) { show(index + delta); }

  // ---------- Gallery ----------
  const gallery = document.createElement('div');
  gallery.className = 'gallery';
  gallery.innerHTML = `
    <header>
      <h2>All examples</h2>
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="video">Games</button>
      <button class="chip" data-filter="page">Websites</button>
      <button class="chip" data-filter="image">Other</button>
      <button class="close" aria-label="Close">×</button>
    </header>
    <div class="grid"></div>`;
  document.body.appendChild(gallery);
  const grid = gallery.querySelector('.grid');
  let galleryBuilt = false, wasPlaying = true;

  function buildGallery() {
    slides.forEach((s, i) => {
      const card = document.createElement('button');
      card.className = 'card';
      card.dataset.i = i;
      card.dataset.type = s.type;
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const im = document.createElement('img');
      im.loading = 'lazy';
      im.alt = '';
      im.src = thumbOf(s) || s.src;
      if (s.type === 'page') im.className = 'page';
      thumb.appendChild(im);
      const kind = document.createElement('span');
      kind.className = 'kind';
      kind.textContent = `${i + 1} · ${KIND[s.type]}`;
      thumb.appendChild(kind);
      const label = document.createElement('div');
      label.className = 'label';
      const b = document.createElement('b');
      b.textContent = s.title || s.label || KIND[s.type];
      label.appendChild(b);
      const sub = s.site || s.sub;
      if (sub) {
        const sp = document.createElement('span');
        sp.textContent = sub;
        label.appendChild(sp);
      }
      card.append(thumb, label);
      grid.appendChild(card);
    });
    galleryBuilt = true;
  }
  function markGalleryCurrent() {
    grid.querySelectorAll('.card').forEach(c =>
      c.classList.toggle('current', +c.dataset.i === index));
  }
  function openGallery() {
    if (!galleryBuilt) buildGallery();
    markGalleryCurrent();
    wasPlaying = playing;
    if (playing) setPlaying(false);
    gallery.classList.add('open');
    const cur = grid.querySelector('.card.current');
    if (cur) cur.scrollIntoView({ block: 'center' });
  }
  function closeGallery(resume = wasPlaying) {
    gallery.classList.remove('open');
    if (resume && !playing) setPlaying(true);
    poke();
  }
  gallery.querySelector('.close').onclick = () => closeGallery();
  gallery.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => {
      gallery.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
      const f = chip.dataset.filter;
      grid.querySelectorAll('.card').forEach(c => {
        c.style.display = (f === 'all' || c.dataset.type === f) ? '' : 'none';
      });
    };
  });
  grid.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    gallery.classList.remove('open');
    // Jumping to a specific example: stay on it until play is pressed.
    if (playing) setPlaying(false);
    show(+card.dataset.i);
    poke();
  });

  // ---------- Input ----------
  let idleTimer = null;
  function poke() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!gallery.classList.contains('open')) document.body.classList.add('idle');
    }, IDLE_MS);
  }

  controls.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    e.stopPropagation();
    poke();
    const act = btn.dataset.act;
    if (act === 'prev') go(-1);
    if (act === 'next') go(1);
    if (act === 'toggle') setPlaying(!playing);
    if (act === 'gallery') openGallery();
    if (act === 'full') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    }
  });

  // Tap the screen to show/hide the controls; swipe left/right to step.
  let downX = null, downY = null;
  document.addEventListener('pointerdown', e => {
    if (gallery.contains(e.target) || controls.contains(e.target)) return;
    downX = e.clientX; downY = e.clientY;
  });
  document.addEventListener('pointerup', e => {
    if (downX === null) return;
    const dx = e.clientX - downX, dy = e.clientY - downY;
    downX = null;
    if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      go(dx < 0 ? 1 : -1);
      poke();
    } else if (Math.abs(dx) < 15 && Math.abs(dy) < 15) {
      if (document.body.classList.contains('idle')) poke();
      else { clearTimeout(idleTimer); document.body.classList.add('idle'); }
    }
  });
  document.addEventListener('mousemove', poke);

  document.addEventListener('keydown', e => {
    if (gallery.classList.contains('open')) {
      if (e.key === 'Escape' || e.key === 'g') closeGallery();
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
    else if (e.key === ' ' || e.key === 'k') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'g') openGallery();
    else if (e.key === 'f') controls.querySelector('[data-act=full]').click();
    else return;
    poke();
  });

  // Touch panels often have a hardware/browser Back button. Keep one extra
  // history entry so Back steps to the previous slide instead of leaving.
  // Browsers ignore history entries added before the first user interaction.
  let historyArmed = false;
  function armHistory() {
    if (historyArmed) return;
    historyArmed = true;
    history.pushState({ slideshow: true }, '');
  }
  document.addEventListener('pointerdown', armHistory, true);
  document.addEventListener('keydown', armHistory, true);
  window.addEventListener('popstate', () => {
    if (gallery.classList.contains('open')) closeGallery();
    else go(-1);
    history.pushState({ slideshow: true }, '');
    poke();
  });

  show(0);
  poke();
</script>
</body>
</html>
