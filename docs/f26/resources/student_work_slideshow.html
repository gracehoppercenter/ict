<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Work Showcase</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide.on { opacity: 1; }
  .slide video,
  .slide img.fit {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  /* Tall website screenshots fill the width and slowly scroll down */
  .slide img.page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    transform: translateY(0);
  }
  .caption {
    position: absolute;
    left: 2vw;
    bottom: 2vw;
    padding: 0.4em 0.9em;
    border-radius: 0.4em;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    font-size: clamp(14px, 1.6vw, 28px);
    line-height: 1.3;
  }
  .caption small {
    display: block;
    opacity: 0.75;
    font-size: 0.7em;
  }
  .caption:empty { display: none; }
</style>
</head>
<body>
<script>
  // Media lives in ./slideshow/. Game clips were captured from the ITD 210
  // game projects (s26/courses/itd210/projects/game/); website images are
  // full-page screenshots of student sites.
  //
  // type 'video': plays once, then advances
  // type 'page':  full-width screenshot that scrolls top to bottom
  // type 'image': shown whole (letterboxed) for `secs` seconds
  const M = 'slideshow/';
  const slides = [
    { type: 'video', src: M + 'zombie.mp4',  title: 'ITD 210 game project', sub: 'zombie wave survival' },
    { type: 'page',  src: M + 'jjjones64610_coder.jpg', title: 'Student portfolio' },
    { type: 'video', src: M + 'fish.mp4',    title: 'Fishhhhhh!', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'a_virginian.jpg', title: 'Student portfolio' },
    { type: 'video', src: M + 'kitty.mp4',   title: 'Sir Kittywhiskerkins the Wizard Cat', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'ghaynes429.jpg', title: 'Student portfolio' },
    { type: 'image', src: 'https://1bmedina.github.io/itd256/Projects/weaviate/media/diagram.png', title: 'ITD 256 project' },
    { type: 'video', src: M + 'titan.mp4',   title: "Titan's Reach", sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'goldenmaca.jpg', title: 'Student portfolio' },
    { type: 'video', src: M + 'chicken.mp4', title: 'Blocky Chicken Run & Jump', sub: 'JavaScript game' },
    { type: 'page',  src: M + 'catey_wrong.jpg', title: 'Student portfolio' },
    { type: 'image', src: 'https://chrismjon.es/images/arl_2050_clusters.png' },
    { type: 'video', src: M + 'island.mp4',  title: 'Island Battle', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'koibots8230.jpg', title: 'KoiBots robotics team website' },
    { type: 'image', src: '../images/culinary.png' },
    { type: 'video', src: M + 'bee.mp4',     title: "Busy as a Honey Bee's Knees", sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'molly_frog.jpg', title: 'Student portfolio' },
    { type: 'video', src: M + 'bach.mp4',    title: 'Bach to Basics', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'toemio.jpg', title: 'Student portfolio' },
    { type: 'image', src: '../images/pycon.jpeg' },
    { type: 'video', src: M + 'orange.mp4',  title: 'Orange Slinger', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'greetingsplayer1.jpg', title: 'Student portfolio' },
    { type: 'page',  src: M + 'apscs.jpg', title: 'APS CS courses site' },
    { type: 'video', src: M + 'skyfall.mp4', title: 'Skyfall', sub: 'ITD 210 game project' },
    { type: 'page',  src: M + 'jacehaberlach.jpg', title: 'Student portfolio' },
    { type: 'image', src: '../images/curses_game.png', title: 'Python curses game' },
    { type: 'page',  src: M + 'anguswwilliams.jpg', title: 'Student portfolio' },
    { type: 'page',  src: M + 'f1showo.jpg', title: 'Student portfolio' },
    { type: 'page',  src: M + 'openbookproject.jpg', title: 'Demystifying Computers' },
    { type: 'page',  src: M + 'frostbitewofpotato.jpg', title: 'Student portfolio' },
  ];

  const PAGE_SECS = 9;     // time on each website screenshot
  const IMAGE_SECS = 7;    // time on each plain image
  const SCROLL_PX_PER_SEC = 160; // cap on scroll speed for very tall pages

  // Two layers that alternate so each slide can crossfade over the last.
  const layers = [0, 1].map(() => {
    const el = document.createElement('div');
    el.className = 'slide';
    document.body.appendChild(el);
    return el;
  });
  const caption = document.createElement('div');
  caption.className = 'caption';
  document.body.appendChild(caption);

  let index = -1, front = 0, timer = null;

  function preload(slide) {
    if (slide.type === 'video') {
      const v = document.createElement('video');
      v.preload = 'auto';
      v.src = slide.src;
    } else {
      new Image().src = slide.src;
    }
  }

  function setCaption(slide) {
    caption.innerHTML = '';
    if (!slide.title) return;
    caption.textContent = slide.title;
    if (slide.sub) {
      const s = document.createElement('small');
      s.textContent = slide.sub;
      caption.appendChild(s);
    }
  }

  function show(i) {
    clearTimeout(timer);
    index = (i + slides.length) % slides.length;
    const slide = slides[index];
    const layer = layers[1 - front];
    layer.innerHTML = '';

    const reveal = () => {
      layers[front].classList.remove('on');
      layer.classList.add('on');
      front = 1 - front;
      setCaption(slide);
      // Stop any video still playing on the outgoing layer after the fade.
      const old = layers[1 - front];
      setTimeout(() => { if (!old.classList.contains('on')) old.innerHTML = ''; }, 900);
      preload(slides[(index + 1) % slides.length]);
    };
    const next = secs => { timer = setTimeout(() => show(index + 1), secs * 1000); };

    if (slide.type === 'video') {
      const v = document.createElement('video');
      v.muted = true;
      v.playsInline = true;
      v.src = slide.src;
      v.onended = () => show(index + 1);
      v.onerror = () => show(index + 1);
      v.oncanplay = () => { v.oncanplay = null; reveal(); v.play(); };
      layer.appendChild(v);
      next(30); // safety net if the video stalls
    } else {
      const img = document.createElement('img');
      img.onerror = () => show(index + 1);
      img.onload = () => {
        const shown = img.naturalHeight * (window.innerWidth / img.naturalWidth);
        const overflow = shown - window.innerHeight;
        if (slide.type === 'page' && overflow > 20) {
          img.className = 'page';
          const secs = Math.max(PAGE_SECS, overflow / SCROLL_PX_PER_SEC + 3);
          // hold at the top for a moment, scroll, then hold at the bottom
          img.style.transition = `transform ${secs - 3}s ease-in-out 1.5s`;
          reveal();
          requestAnimationFrame(() => requestAnimationFrame(() => {
            img.style.transform = `translateY(${-overflow}px)`;
          }));
          next(secs);
        } else {
          img.className = 'fit';
          reveal();
          next(slide.type === 'page' ? PAGE_SECS : (slide.secs || IMAGE_SECS));
        }
      };
      img.src = slide.src;
      layer.appendChild(img);
    }
  }

  // Arrow keys / space to step manually (handy when presenting).
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') show(index + 1);
    if (e.key === 'ArrowLeft') show(index - 1);
  });

  show(0);
</script>
</body>
</html>
